</div><script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

/* PLAYER */

const player={
    x:0,
    y:0,
    radius:19,
    speed:4,
    hp:100,
    maxHp:100,
    level:1,
    xp:0,
    nextXP:50,
    attack:10,
    defense:0,
    potions:3,
    attackCooldown:0
};

let playing=false;
let waveTransition=false;
let waveTimer=0;
let wave=1;

let enemies=[];
let drops=[];
let particles=[];
let inventory=[];

/* ITENS */

const itemTypes=[
    {name:"Espada",icon:"🗡️",type:"attack",value:3},
    {name:"Machado",icon:"🪓",type:"attack",value:7},
    {name:"Armadura",icon:"🛡️",type:"defense",value:3},
    {name:"Capacete",icon:"⛑️",type:"defense",value:2},
    {name:"Coração",icon:"❤️",type:"health",value:15},
    {name:"Botas",icon:"👢",type:"speed",value:.25}
];

/* INVENTÁRIO */

function bonusName(type){
    if(type==="attack")return"ATQ";
    if(type==="defense")return"DEF";
    if(type==="health")return"VIDA";
    if(type==="speed")return"VEL";
    return"";
}

function renderInventory(){

    const slots=document.getElementById("slots");
    slots.innerHTML="";

    for(let i=0;i<6;i++){

        const slot=document.createElement("div");
        slot.className="slot";

        if(inventory[i]){

            const item=inventory[i];

            slot.innerHTML=
                item.icon+
                "<small>"+
                item.name+
                "<br>+"+
                item.value+
                " "+
                bonusName(item.type)+
                "</small>";

        }else{

            slot.classList.add("empty");
            slot.textContent="—";
        }

        slots.appendChild(slot);
    }

    document.getElementById("stats").innerHTML=
        "<b>📊 Atributos</b><br>"+
        "⚔️ Ataque: "+player.attack+"<br>"+
        "🛡️ Defesa: "+player.defense+"<br>"+
        "❤️ Vida máxima: "+player.maxHp+"<br>"+
        "👢 Velocidade: "+player.speed.toFixed(2);
}

function collectItem(item){

    if(inventory.length>=6){
        showMessage("🎒 Inventário cheio!");
        return;
    }

    inventory.push(item);

    if(item.type==="attack")player.attack+=item.value;

    if(item.type==="defense")player.defense+=item.value;

    if(item.type==="health"){
        player.maxHp+=item.value;
        player.hp+=item.value;
    }

    if(item.type==="speed")player.speed+=item.value;

    particle(player.x,player.y,item.icon+" "+item.name);

    showMessage("🎒 Pegou: "+item.name);

    renderInventory();
}

function openInventory(){
    renderInventory();
    document.getElementById("inventory").style.display="block";
}

function closeInventory(){
    document.getElementById("inventory").style.display="none";
}

document.getElementById("inventoryButton").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        openInventory();
    }
);

document.getElementById("closeInventory").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        closeInventory();
    }
);

/* DROP */

function createDrop(x,y){

    if(Math.random()>.25)return;

    const item=
        itemTypes[
            Math.floor(Math.random()*itemTypes.length)
        ];

    drops.push({
        x:x,
        y:y,
        item:item,
        life:900
    });
}

/* JOYSTICK */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joystickActive=false;
let joystickPointer=null;

function updateJoystick(x,y){

    const rect=joystick.getBoundingClientRect();

    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=42;
    const distance=Math.hypot(dx,dy);

    if(distance>max){
        dx=dx/distance*max;
        dy=dy/distance*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.left=(42+dx-28)+"px";
    stick.style.top=(42+dy-28)+"px";
}

function resetJoystick(){

    joystickActive=false;
    joystickPointer=null;

    joyX=0;
    joyY=0;

    stick.style.left="39px";
    stick.style.top="39px";
}

joystick.addEventListener("pointerdown",e=>{

    e.preventDefault();

    joystickActive=true;
    joystickPointer=e.pointerId;

    updateJoystick(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{

    if(!joystickActive)return;
    if(e.pointerId!==joystickPointer)return;

    e.preventDefault();

    updateJoystick(e.clientX,e.clientY);
});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

/* ATAQUE */

document.getElementById("attackButton").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        attack();
    }
);

function attack(){

    if(!playing)return;
    if(waveTransition)return;
    if(player.attackCooldown>0)return;

    player.attackCooldown=22;

    let closest=null;
    let closestDistance=Infinity;

    for(const enemy of enemies){

        const distance=Math.hypot(
            player.x-enemy.x,
            player.y-enemy.y
        );

        if(distance<closestDistance){
            closestDistance=distance;
            closest=enemy;
        }
    }

    if(closest && closestDistance<=100){

        closest.hp-=player.attack;

        particle(
            closest.x,
            closest.y,
            "-"+player.attack
        );

        if(closest.hp<=0){

            createDrop(closest.x,closest.y);
            gainXP(closest.xp);

            particle(
                closest.x,
                closest.y,
                "+"+closest.xp+" XP"
            );

            const index=enemies.indexOf(closest);

            if(index>=0)enemies.splice(index,1);
        }

    }else{

        particle(
            player.x+35,
            player.y,
            "⚔️"
        );
    }

    checkWaveClear();
}

/* POÇÃO */

document.getElementById("potionButton").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        usePotion();
    }
);

function usePotion(){

    if(!playing)return;

    if(player.potions<=0){
        showMessage("❌ Sem poções!");
        return;
    }

    if(player.hp>=player.maxHp){
        showMessage("❤️ Vida cheia!");
        return;
    }

    player.potions--;

    player.hp=Math.min(
        player.maxHp,
        player.hp+45
    );

    particle(
        player.x,
        player.y,
        "+45 ❤️"
    );
}

/* JOGO */

function startGame(){

    document.getElementById("menu").style.display="none";
    document.getElementById("gameOver").style.display="none";
    document.getElementById("waveScreen").style.display="none";

    player.x=W/2;
    player.y=H/2;

    player.hp=100;
    player.maxHp=100;
    player.level=1;
    player.xp=0;
    player.nextXP=50;
    player.attack=10;
    player.defense=0;
    player.speed=4;
    player.potions=3;
    player.attackCooldown=0;

    inventory=[];
    enemies=[];
    drops=[];
    particles=[];

    wave=1;
    waveTransition=false;
    playing=true;

    startWave();

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);
}

document.getElementById("playButton").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        startGame();
    }
);

document.getElementById("restartButton").addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        startGame();
    }
);

/* HORDA */

function startWave(){

    enemies=[];
    drops=[];

    const amount=5+wave*2;

    for(let i=0;i<amount;i++){
        createEnemy();
    }

    showMessage(
        "🌊 Horda "+wave+" começou!"
    );

    updateHUD();
}

/* MONSTROS */

function createEnemy(){

    const angle=Math.random()*Math.PI*2;

    const distance=
        Math.max(W,H)*.55+
        Math.random()*180;

    let type="slime";

    if(player.level>=5 && Math.random()<.4){
        type="orc";
    }

    if(player.level>=10 && Math.random()<.3){
        type="demon";
    }

    if(
        player.level>=15 &&
        wave%5===0 &&
        Math.random()<.12
    ){
        type="boss";
    }

    const enemy={
        x:player.x+Math.cos(angle)*distance,
        y:player.y+Math.sin(angle)*distance,
        type:type,
        size:28,
        hp:30,
        maxHp:30,
        speed:1,
        damage:5,
        xp:15,
        color:"#8e44ad",
        name:"Slime",
        cooldown:0
    };

    if(type==="slime"){

        enemy.maxHp=Math.floor(30+wave*12);
        enemy.hp=enemy.maxHp;
        enemy.speed=1+wave*.025;
        enemy.damage=4+wave;
        enemy.xp=15+wave*4;
        enemy.color="#8e44ad";
        enemy.name="Slime";
    }

    if(type==="orc"){

        enemy.size=38;
        enemy.maxHp=Math.floor(90+wave*25);
        enemy.hp=enemy.maxHp;
        enemy.speed=.75;
        enemy.damage=8+wave*2;
        enemy.xp=35+wave*5;
        enemy.color="#557a3e";
        enemy.name="Orc";
    }

    if(type==="demon"){

        enemy.size=45;
        enemy.maxHp=Math.floor(170+wave*40);
        enemy.hp=enemy.maxHp;
        enemy.speed=1.05;
        enemy.damage=13+wave*2;
        enemy.xp=70+wave*8;
        enemy.color="#c0392b";
        enemy.name="Demônio";
    }

    if(type==="boss"){

        enemy.size=70;
        enemy.maxHp=Math.floor(700+wave*180);
        enemy.hp=enemy.maxHp;
        enemy.speed=.55;
        enemy.damage=20+wave*3;
        enemy.xp=300+wave*30;
        enemy.color="#43164f";
        enemy.name="👑 CHEFE";
    }

    enemies.push(enemy);
}

/* XP */

function gainXP(amount){

    player.xp+=amount;

    while(player.xp>=player.nextXP){

        player.xp-=player.nextXP;

        player.level++;

        player.nextXP=
            Math.floor(player.nextXP*1.45);

        player.maxHp+=15;
        player.hp=player.maxHp;
        player.attack+=3;

        particle(
            player.x,
            player.y,
            "⬆️ NÍVEL "+player.level
        );

        if(player.level===5)
            showMessage("👹 ORCS DESBLOQUEADOS!");

        if(player.level===10)
            showMessage("🔥 DEMÔNIOS DESBLOQUEADOS!");

        if(player.level===15)
            showMessage("👑 CHEFES DESBLOQUEADOS!");
    }
}

/* LIMPAR HORDA */

function checkWaveClear(){

    if(!playing)return;
    if(waveTransition)return;

    if(enemies.length===0){

        waveTransition=true;
        waveTimer=180;

        document.getElementById("waveTitle").textContent=
            "🌊 HORDA "+wave+" LIMPA!";

        document.getElementById("waveDescription").textContent=
            "Próxima horda chegando...";

        document.getElementById("waveScreen").style.display="flex";
    }
}

function nextWave(){

    wave++;
    waveTransition=false;

    document.getElementById("waveScreen").style.display="none";

    player.hp=Math.min(
        player.maxHp,
        player.hp+25
    );

    if(wave%3===0){
        player.potions++;
        showMessage("🧪 Você ganhou uma poção!");
    }

    startWave();
}

/* UPDATE */

function update(delta){

    if(!playing)return;

    if(waveTransition){

        waveTimer-=delta;

        if(waveTimer<=0){
            nextWave();
        }

        updateHUD();

        return;
    }

    player.x+=joyX*player.speed*delta;
    player.y+=joyY*player.speed*delta;

    player.x=Math.max(
        25,
        Math.min(W-25,player.x)
    );

    player.y=Math.max(
        35,
        Math.min(H-25,player.y)
    );

    if(player.attackCooldown>0)
        player.attackCooldown-=delta;

    for(const enemy of enemies){

        const dx=player.x-enemy.x;
        const dy=player.y-enemy.y;

        const distance=Math.hypot(dx,dy);

        if(distance>45){

            if(distance>0){

                enemy.x+=
                    dx/distance*
                    enemy.speed*
                    delta;

                enemy.y+=
                    dy/distance*
                    enemy.speed*
                    delta;
            }

        }else{

            if(enemy.cooldown<=0){

                const damage=Math.max(
                    1,
                    enemy.damage-player.defense
                );

                player.hp-=damage;

                enemy.cooldown=50;

                particle(
                    player.x,
                    player.y,
                    "-"+damage
                );

                if(player.hp<=0){

                    player.hp=0;
                    endGame();
                    return;
                }
            }
        }

        if(enemy.cooldown>0)
            enemy.cooldown-=delta;
    }

    for(let i=drops.length-1;i>=0;i--){

        const drop=drops[i];

        drop.life-=delta;

        const distance=Math.hypot(
            player.x-drop.x,
            player.y-drop.y
        );

        if(distance<38){

            collectItem(drop.item);
            drops.splice(i,1);
            continue;
        }

        if(drop.life<=0)
            drops.splice(i,1);
    }

    for(const p of particles){

        p.y-=.5*delta;
        p.life-=delta;
    }

    particles=particles.filter(
        p=>p.life>0
    );

    updateHUD();
}

/* MAPA */

function drawMap(){

    ctx.fillStyle="#397044";
    ctx.fillRect(0,0,W,H);

    for(let x=0;x<W;x+=40){

        for(let y=0;y<H;y+=40){

            ctx.fillStyle=
                ((x/40+y/40)%2===0)
                ?"#3f7849"
                :"#397044";

            ctx.fillRect(x,y,40,40);
        }
    }

    ctx.fillStyle="#96734c";

    ctx.fillRect(
        0,
        H/2-30,
        W,
        60
    );

    ctx.fillRect(
        W/2-30,
        0,
        60,
        H
    );

    ctx.fillStyle="rgba(255,255,255,.13)";

    for(let i=0;i<50;i++){

        const x=(i*91)%W;
        const y=(i*53)%H;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* PLAYER */

function drawPlayer(){

    ctx.fillStyle="rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y+17,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#2474b5";

    ctx.fillRect(
        player.x-15,
        player.y-5,
        30,
        28
    );

    ctx.fillStyle="#f0bd7a";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-14,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#392318";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y-18,
        11,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.fillRect(
        player.x-6,
        player.y-15,
        3,
        3
    );

    ctx.fillRect(
        player.x+3,
        player.y-15,
        3,
        3
    );

    ctx.strokeStyle="#eee";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        player.x+10,
        player.y+3
    );

    ctx.lineTo(
        player.x+30,
        player.y-22
    );

    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.font="bold 11px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        "LV "+player.level,
        player.x,
        player.y+40
    );
}

/* MONSTROS */

function drawEnemies(){

    for(const enemy of enemies){

        ctx.fillStyle="rgba(0,0,0,.4)";

        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y+enemy.size*.45,
            enemy.size*.45,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle=enemy.color;

        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y,
            enemy.size/2,
            0,
            Math.PI*2
        );

        ctx.fill();

        if(
            enemy.type==="demon"||
            enemy.type==="boss"
        ){

            ctx.fillStyle="#32101d";

            ctx.beginPath();

            ctx.moveTo(
                enemy.x-enemy.size*.25,
                enemy.y-enemy.size*.25
            );

            ctx.lineTo(
                enemy.x-enemy.size*.45,
                enemy.y-enemy.size*.75
            );

            ctx.lineTo(
                enemy.x,
                enemy.y-enemy.size*.3
            );

            ctx.fill();

            ctx.beginPath();

            ctx.moveTo(
                enemy.x+enemy.size*.25,
                enemy.y-enemy.size*.25
            );

            ctx.lineTo(
                enemy.x+enemy.size*.45,
                enemy.y-enemy.size*.75
            );

            ctx.lineTo(
                enemy.x,
                enemy.y-enemy.size*.3
            );

            ctx.fill();
        }

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            enemy.x-enemy.size*.2,
            enemy.y-enemy.size*.08,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            enemy.x+enemy.size*.2,
            enemy.y-enemy.size*.08,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            enemy.x-enemy.size*.2,
            enemy.y-enemy.size*.08,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            enemy.x+enemy.size*.2,
            enemy.y-enemy.size*.08,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

        const barWidth=Math.max(
            60,
            enemy.size*1.7
        );

        const barHeight=
            enemy.type==="boss"?9:7;

        const barX=
            enemy.x-barWidth/2;

        const barY=
            enemy.y-
            enemy.size/2-
            25;

        if(enemy.type!=="slime"){

            ctx.fillStyle="#fff";
            ctx.font="bold 11px Arial";
            ctx.textAlign="center";

            ctx.fillText(
                enemy.name,
                enemy.x,
                barY-18
            );
        }

        ctx.fillStyle="#111";

        ctx.fillRect(
            barX,
            barY,
            barWidth,
            barHeight
        );

        const hpPercent=Math.max(
            0,
            Math.min(
                1,
                enemy.hp/enemy.maxHp
            )
        );

        ctx.fillStyle=
            enemy.type==="boss"
            ?"#ff1744"
            :"#39d353";

        ctx.fillRect(
            barX,
            barY,
            barWidth*hpPercent,
            barHeight
        );

        ctx.fillStyle="#fff";

        ctx.font=
            "bold "+
            (enemy.type==="boss"?12:10)+
            "px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            Math.ceil(enemy.hp)+
            " / "+
            Math.ceil(enemy.maxHp),
            enemy.x,
            barY-4
        );
    }
}

/* DROPS */

function drawDrops(){

    for(const drop of drops){

        ctx.globalAlpha=
            .75+
            Math.sin(drop.life*.1)*.2;

        ctx.fillStyle="#ffd54f";

        ctx.beginPath();

        ctx.arc(
            drop.x,
            drop.y,
            17,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.globalAlpha=1;

        ctx.font="23px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            drop.item.icon,
            drop.x,
            drop.y+8
        );
    }
}

/* PARTICULAS */

function particle(x,y,text){

    particles.push({
        x:x,
        y:y,
        text:text,
        life:60
    });
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=p.life/60;

        ctx.fillStyle="#fff";
        ctx.font="bold 16px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            p.text,
            p.x,
            p.y
        );

        ctx.globalAlpha=1;
    }
}

/* HUD */

function updateHUD(){

    document.getElementById("levelText").textContent=
        "⚔️ Nível "+player.level;

    document.getElementById("attackText").textContent=
        player.attack;

    document.getElementById("defenseText").textContent=
        player.defense;

    document.getElementById("potionText").textContent=
        player.potions;

    document.getElementById("waveText").textContent=
        "🌊 Horda "+wave;

    document.getElementById("enemyCount").textContent=
        enemies.length;

    document.getElementById("hpBar").style.width=
        Math.max(
            0,
            player.hp/player.maxHp*100
        )+"%";

    document.getElementById("xpBar").style.width=
        Math.max(
            0,
            player.xp/player.nextXP*100
        )+"%";
}

/* MENSAGEM */

let messageTimeout=null;

function showMessage(text){

    const message=document.getElementById("message");

    message.textContent=text;

    if(messageTimeout!==null)
        clearTimeout(messageTimeout);

    messageTimeout=setTimeout(
        ()=>{
            message.textContent=
                "⚔️ Derrote todos os monstros!";
        },
        2200
    );
}

/* GAME OVER */

function endGame(){

    playing=false;

    document.getElementById("result").textContent=
        "Nível "+
        player.level+
        " • Horda "+
        wave;

    document.getElementById("gameOver").style.display="flex";
}

/* LOOP */

let lastTime=performance.now();

function gameLoop(time){

    if(!playing){

        draw();
        return;
    }

    let delta=(time-lastTime)/16.67;

    if(!Number.isFinite(delta))delta=1;
    if(delta>2)delta=2;
    if(delta<0)delta=1;

    lastTime=time;

    update(delta);
    draw();

    requestAnimationFrame(gameLoop);
}

function draw(){

    drawMap();
    drawDrops();
    drawEnemies();
    drawPlayer();
    drawParticles();
}

/* PWA */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        ()=>{
            navigator.serviceWorker.register(
                "./service-worker.js"
            ).catch(
                error=>console.log(
                    "Service Worker:",
                    error
                )
            );
        }
    );
}

draw();
updateHUD();

</script></body>
</html>
